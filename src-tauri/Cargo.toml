[package]
name = "or-patient-management"
version = "0.1.0"
description = "OR Patient Management & Research System"
edition = "2021"

[lib]
name = "or_patient_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
